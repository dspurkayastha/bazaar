services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bazaar
      POSTGRES_PASSWORD: bazaar
      POSTGRES_DB: bazaar
    ports:
      # localhost only; never expose Postgres on a public interface
      - '127.0.0.1:${BAZAAR_PG_PORT:-5433}:5432'
    volumes:
      - bazaar-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bazaar -d bazaar']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bazaar-pg:
